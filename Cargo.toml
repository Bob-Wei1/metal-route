[workspace]
resolver = "2"
members = [
    "crates/mr-core",
    "crates/mr-grid",
    "crates/mr-fixtures",
    "crates/mr-cpu",
    "crates/mr-ingest",
    "crates/mr-srj",
    "crates/mr-drc",
    "crates/mr-oracle",
    "crates/mr-metal",
    "crates/mr-bench",
    "crates/mr-server",
    "crates/mr-bridge",
    "crates/mr-cli",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/embedder/metalroute"
rust-version = "1.93"

[workspace.dependencies]
# internal crates
mr-core = { path = "crates/mr-core" }
mr-grid = { path = "crates/mr-grid" }
mr-fixtures = { path = "crates/mr-fixtures" }
mr-cpu = { path = "crates/mr-cpu" }
mr-ingest = { path = "crates/mr-ingest" }
mr-srj = { path = "crates/mr-srj" }
mr-drc = { path = "crates/mr-drc" }
mr-oracle = { path = "crates/mr-oracle" }
mr-metal = { path = "crates/mr-metal" }
mr-bench = { path = "crates/mr-bench" }
mr-bridge = { path = "crates/mr-bridge" }
# external
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
